# AWS Amplify Hosting build settings.
#
# This file exists for one reason: Amplify does not give a Next.js server
# runtime access to the environment variables set in its console. That is
# deliberate on AWS's part — build environments hold secrets, and the SSR
# compute function is not automatically trusted with them — but it means an
# app that reads process.env on the server sees nothing at all unless the
# build writes the values into a file Next.js loads. That is what the
# `.env.production` line below does.
#
# Consequences worth knowing before you rely on this:
#
#   - Console *Secrets* are not environment variables. They are SSM Parameter
#     Store entries and never appear in process.env under their own name, so
#     every value this app needs must be an Environment variable instead.
#   - Anything forwarded here lands in a build artifact. Whoever can read the
#     deployment can read these values. That is acceptable for an issuer URL
#     and a client id; for the two secrets it is a real trade against the
#     alternative, which is reading them from SSM at runtime with the app's
#     service role.
#
# Names only are listed, so adding a variable in the console is not enough on
# its own — it has to be named here too.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Anchored to the start of the line so a variable is matched by its own
        # name and never by another variable's value. `|| true` keeps a build
        # alive when nothing matches: grep exits 1 on no match, which would
        # otherwise fail the phase and make a missing variable look like a
        # broken build.
        - env | grep -E '^(COGNITO_CLIENT_ID|COGNITO_CLIENT_SECRET|COGNITO_ISSUER|NEXTAUTH_URL|NEXTAUTH_SECRET|DIAGNOSTICS_TOKEN|INVENTORY_DRIVER|INVENTORY_TABLE|INVENTORY_FILE|ACCOUNTS_DRIVER|ACCOUNTS_FILE)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
