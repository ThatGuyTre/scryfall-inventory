AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MTG Inventory Tool — the AWS side of Phase 2. Creates the DynamoDB table that
  holds collections, groups and decklists, the Cognito user pool that signs
  people in, and — when an Amplify Hosting app id is supplied — the IAM
  service role that app needs to read its own Secret management values.

  Review this template before deploying it. `npm run infra:changeset` only
  prepares a change set; you execute it yourself.

Parameters:
  ProjectName:
    Type: String
    Default: mtg-inventory-tool
    Description: Prefix for resource names.
    AllowedPattern: "[a-z0-9-]+"

  CognitoDomainPrefix:
    Type: String
    Description: >
      Prefix for the Cognito hosted sign-in domain. Must be globally unique
      across all of AWS, so put something of your own in it.
    AllowedPattern: "[a-z0-9-]+"
    MinLength: 3
    MaxLength: 63

  CallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000/api/auth/callback/cognito"
    Description: >
      Where Cognito returns after sign-in. next-auth expects the path
      /api/auth/callback/cognito. Add your deployed URL alongside localhost.

  LogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000"
    Description: Where Cognito returns after sign-out.

  EnablePointInTimeRecovery:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Continuous backups for the table, restorable to any second in the last 35
      days. Adds cost proportional to table size; worth it for a collection you
      would hate to re-import.

  EnableDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Refuse to delete the table, even if the stack is deleted.

  AmplifyAppId:
    Type: String
    Default: ""
    Description: >
      The Amplify Hosting app id, if this app is deployed there — the segment
      after "apps/" in its App ARN (arn:aws:amplify:<region>:<account>:apps/
      <this value>). Amplify Hosting apps are created outside this template
      (through the console's "host a web app" flow), so this only lets the
      template attach a correctly scoped service role to an app that already
      exists; it does not create the app itself. Leave blank to skip the role
      entirely.

Conditions:
  UsePointInTimeRecovery: !Equals [!Ref EnablePointInTimeRecovery, "true"]
  UseDeletionProtection: !Equals [!Ref EnableDeletionProtection, "true"]
  HasAmplifyAppId: !Not [!Equals [!Ref AmplifyAppId, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------

  InventoryTable:
    Type: AWS::DynamoDB::Table
    # Keep the data even if the stack goes away. Collections are re-importable
    # from ManaBox, but groups and decklists are not.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}"
      # On-demand: no capacity to plan, and nothing billed while idle. The read
      # patterns here are bursty by nature — a commander search reads a lot at
      # once and then nothing for minutes.
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [UseDeletionProtection, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [UsePointInTimeRecovery, true, false]
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Filtering a collection to one deck or binder, or to every location of
        # a kind. Only card items carry these attributes, so the index stays
        # small — DynamoDB omits items that lack the key.
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # Identity
  # ---------------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      # Sign in with an email address. Cognito owns the credential; this app
      # never sees a password.
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolTags:
        Project: !Ref ProjectName

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-web"
      UserPoolId: !Ref UserPool
      # next-auth runs server side, so it can hold a secret. A confidential
      # client is the safer of the two options.
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      # Short-lived access tokens, long-lived refresh, so a signed-in session
      # survives a day of use without holding a valid access token for it.
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  # ---------------------------------------------------------------------------
  # Hosting
  # ---------------------------------------------------------------------------

  AmplifyServiceRole:
    Type: AWS::IAM::Role
    Condition: HasAmplifyAppId
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      # Amplify's own managed policy for a hosting/backend service role. It is
      # scoped to Amplify's operations rather than being account-wide.
      #
      # This role covers builds. It does NOT give the running app access to
      # anything: a service role and an SSR compute role are separate, attached
      # with separate flags, and assumed by separate things. Believing otherwise
      # is what makes a correctly configured deployment insist that Cognito is
      # not set up, so see AmplifyComputeRole below for the runtime half.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess-Amplify
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # The role the SSR compute function itself assumes, which is what lets the
  # running app read its secrets out of Parameter Store instead of having the
  # build bake them into a deployment artifact.
  #
  # Least privilege, and deliberately narrow: read access to exactly the path
  # Amplify keeps this app's "all branches" secrets under, and permission to
  # decrypt them. Nothing else. Amplify's docs are blunt about why that matters
  # — these credentials are live in the SSR runtime, so any code execution bug in
  # the app inherits whatever this role can do.
  AmplifyComputeRole:
    Type: AWS::IAM::Role
    Condition: HasAmplifyAppId
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadAmplifySharedSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # GetParametersByPath is what the app calls, so it can read every
              # secret in one request without knowing their names in advance.
              # GetParameters is included because it is the natural way to fetch
              # a single named secret, and granting it costs nothing extra given
              # the path is already readable.
              - Effect: Allow
                Action:
                  - ssm:GetParametersByPath
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/amplify/shared/${AmplifyAppId}/*"
              # Secrets are SecureString, encrypted with the account's default
              # SSM key. The ViaService condition means this permission is only
              # usable through Parameter Store, so it cannot be turned into
              # general-purpose decryption of anything else under that key.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
        - PolicyName: ReadWriteInventoryTable
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Exactly the calls the DynamoDB inventory driver makes, and no
              # others: Query for every read, UpdateItem for the merge path
              # (which adds to a quantity rather than overwriting it), and
              # BatchWriteItem for replace and clear. Scoped to this table and
              # its indexes, so the role cannot reach another table in the
              # account.
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt InventoryTable.Arn
                  - !Sub "${InventoryTable.Arn}/index/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  TableName:
    Description: Set as INVENTORY_TABLE in .env.local
    Value: !Ref InventoryTable

  UserPoolId:
    Description: Cognito user pool id
    Value: !Ref UserPool

  CognitoClientId:
    Description: Set as COGNITO_CLIENT_ID in .env.local
    Value: !Ref UserPoolClient

  CognitoIssuer:
    Description: Set as COGNITO_ISSUER in .env.local
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  CognitoHostedUiDomain:
    Description: Where people are sent to sign in
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

  ClientSecretCommand:
    Description: >
      The client secret is deliberately not an output, since stack outputs are
      readable by anyone with describe-stacks. Run this to read it.
    Value: !Sub >-
      aws cognito-idp describe-user-pool-client --user-pool-id ${UserPool}
      --client-id ${UserPoolClient} --query UserPoolClient.ClientSecret --output text

  AttachAmplifyRolesCommand:
    Description: >
      CloudFormation cannot reach into the Amplify app to attach these roles
      itself, since the app is not a resource this stack manages. Run this once,
      after the roles exist, to attach both. The two flags are not
      interchangeable: --iam-service-role-arn is the build role, and
      --compute-role-arn is the one the running app assumes to read its secrets.
      Attaching only the first is what leaves a fully configured app reporting
      that Cognito is not set up.
    Condition: HasAmplifyAppId
    Value: !Sub >-
      aws amplify update-app --app-id ${AmplifyAppId}
      --iam-service-role-arn ${AmplifyServiceRole.Arn}
      --compute-role-arn ${AmplifyComputeRole.Arn}

  SecretsPath:
    Description: >
      Where the app expects its secrets. Set COGNITO_CLIENT_ID,
      COGNITO_CLIENT_SECRET, COGNITO_ISSUER and NEXTAUTH_SECRET in the Amplify
      console under Secret management, scoped to "All branches", and they land
      here. Branch-scoped secrets get an Amplify-generated hash in their path
      that the running app cannot derive, so they are not supported.
    Condition: HasAmplifyAppId
    Value: !Sub "/amplify/shared/${AmplifyAppId}/"
