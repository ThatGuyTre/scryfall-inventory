AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MTG Inventory Tool — the AWS side of Phase 2. Creates the DynamoDB table that
  holds collections, groups and decklists, and the Cognito user pool that signs
  people in. Nothing else in the app needs AWS.

  Review this template before deploying it. `npm run infra:changeset` only
  prepares a change set; you execute it yourself.

Parameters:
  ProjectName:
    Type: String
    Default: mtg-inventory-tool
    Description: Prefix for resource names.
    AllowedPattern: "[a-z0-9-]+"

  CognitoDomainPrefix:
    Type: String
    Description: >
      Prefix for the Cognito hosted sign-in domain. Must be globally unique
      across all of AWS, so put something of your own in it.
    AllowedPattern: "[a-z0-9-]+"
    MinLength: 3
    MaxLength: 63

  CallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000/api/auth/callback/cognito"
    Description: >
      Where Cognito returns after sign-in. next-auth expects the path
      /api/auth/callback/cognito. Add your deployed URL alongside localhost.

  LogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000"
    Description: Where Cognito returns after sign-out.

  EnablePointInTimeRecovery:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Continuous backups for the table, restorable to any second in the last 35
      days. Adds cost proportional to table size; worth it for a collection you
      would hate to re-import.

  EnableDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Refuse to delete the table, even if the stack is deleted.

Conditions:
  UsePointInTimeRecovery: !Equals [!Ref EnablePointInTimeRecovery, "true"]
  UseDeletionProtection: !Equals [!Ref EnableDeletionProtection, "true"]

Resources:
  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------

  InventoryTable:
    Type: AWS::DynamoDB::Table
    # Keep the data even if the stack goes away. Collections are re-importable
    # from ManaBox, but groups and decklists are not.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}"
      # On-demand: no capacity to plan, and nothing billed while idle. The read
      # patterns here are bursty by nature — a commander search reads a lot at
      # once and then nothing for minutes.
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [UseDeletionProtection, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [UsePointInTimeRecovery, true, false]
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Filtering a collection to one deck or binder, or to every location of
        # a kind. Only card items carry these attributes, so the index stays
        # small — DynamoDB omits items that lack the key.
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # Identity
  # ---------------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      # Sign in with an email address. Cognito owns the credential; this app
      # never sees a password.
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolTags:
        Project: !Ref ProjectName

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-web"
      UserPoolId: !Ref UserPool
      # next-auth runs server side, so it can hold a secret. A confidential
      # client is the safer of the two options.
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      # Short-lived access tokens, long-lived refresh, so a signed-in session
      # survives a day of use without holding a valid access token for it.
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

Outputs:
  TableName:
    Description: Set as INVENTORY_TABLE in .env.local
    Value: !Ref InventoryTable

  UserPoolId:
    Description: Cognito user pool id
    Value: !Ref UserPool

  CognitoClientId:
    Description: Set as COGNITO_CLIENT_ID in .env.local
    Value: !Ref UserPoolClient

  CognitoIssuer:
    Description: Set as COGNITO_ISSUER in .env.local
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  CognitoHostedUiDomain:
    Description: Where people are sent to sign in
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

  ClientSecretCommand:
    Description: >
      The client secret is deliberately not an output, since stack outputs are
      readable by anyone with describe-stacks. Run this to read it.
    Value: !Sub >-
      aws cognito-idp describe-user-pool-client --user-pool-id ${UserPool}
      --client-id ${UserPoolClient} --query UserPoolClient.ClientSecret --output text
